<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student form event</title>
</head>
<script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
<style>
        body{
           font-family: arial; 
        }
        #box{
            background: pink;
            padding:10px;
            border:1px solid #000;
        }
        #test{
             background: rgb(184, 6, 6);
            padding:10px;
            border:2px solid #000;
        }
    </style>
<body>
    <h1>Student Form Event</h1>
    <form action="" id="sform">
        <label for="">Name</label><input type="text" id="sname">
         <label for="">Class</label><input type="text" id="sclass">
          <label for="">Country</label><select id="scountry">
            <option value="India">India</option>
            <option value="America">America</option>
            <option value="Nepal">Nepal</option>
            <option value="China">China</option>
          </select><br><br>
          <input type="submit">
          <div id="test"></div>


    </form>
    <script>
        $(document).ready(function(){
            $('#sname,#sclass,#scountry').focus(function(){
                $(this).css('background-color','lime');
            });
             $('#sname,#sclass,#scountry').blur(function(){
                $(this).css('background-color','');
            });
            $('#scountry').change(function(){
                $(this).css('background-color','blue');
                var a=$(this).val();
                $('#test').html(a);
            });
            $('#sname','#sclass').select(function(){
                $(this).css('background-color','yellow');
            });
             $('#sform').submit(function(e){
                e.preventDefault();
                $(this).css('background-color','green');
                console.log("form submitted successfully");
            });
        })
    </script>
</body>
</html>
